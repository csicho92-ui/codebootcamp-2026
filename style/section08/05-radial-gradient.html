<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선형 그라데이션 실습</title>
    <style>
        .상자1 {
            width: 300px;
            height: 300px;
            margin: 20px;

            background: radial-gradient(pink, purple);

            background: radial-gradient(pink 50%, purple 100% );
           
        }
        .상자2 {
            width: 300px;
            height: 300px;
            margin: 20px;

            /* 참고) 그라디언트 만들기 주소: https://cssgradient.io/ */
            background: radial-gradient(yellow, red, green);
                      
        }
    </style>
</head>
<body>
    <div class="상자1"></div>
    <div class="상자2"></div>
</body>
</html>
