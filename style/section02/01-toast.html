<!DOCTYPE html>
<html lang="en">
<head>
    <title>토스트</title>
    <style>
        .toast {
          width: 300px;
          height: 100px;
          color: white;
          background-color: black;
          text-align: center;
          line-height: 30px;
          border-radius: 15px;
          animation: toast 3s ease-in-out;
          animation-duration: 3s;
        }
    </style>
</head>
<body>
    <div class="toast">
        안녕하세요 저는 css를 학습하고 있는 사람입니다.
    </div>
</body>
</html>
