        }

            /*자식요소가 부모요소보다 작아지지 않도록 설정*/

        }

</head>
<body>

        <div class="child"></div>
        <div class="child"></div>

        <div class="child"></div>
        <div class="child"></div>
    </div>
 
</body>
</html>
