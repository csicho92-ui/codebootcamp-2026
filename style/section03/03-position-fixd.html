<!DOCTYPE html>
<html lang="en">
<head>
    <title>고정위치</title>
    <!-- 정해진 위치에 있는것, 문의 버튼 같은 예시 -->
    <style>
        .floating_button {
            width: 100pt;
            height: 100pt;
            background-color: rgb(26, 30, 223);
            border-radius: 100%;
            cursor: pointer;

            position: fixed;
            right: 20px;
            bottom: 20px;

        }
    </style>

</head>
<body>
    <div class="floating_button"></div>
</body>
</html>
