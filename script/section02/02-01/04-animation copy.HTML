<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transform with Transition 실습</title>
    <style>
       .box {
            width: 300px;
            height: 300px;
            background-color: green;

            transition: 
                transform 1s
                background-color 1s       
       }
       .box:hover {
            transform: rotate(180deg) ;
            background-color: red;
       }
</head>
<body>
    <div class="box">
        <p>
            안녕하세요 저는 css를 학습하고 있는 사람입니다. 
        </p>
    </div>
    
</body>
</html>
