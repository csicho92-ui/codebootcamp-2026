<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transform 실습</title>
    <style>
        .비틀기 {
            transform: skewX(30deg);
        }
        .확대 {
            transform: scale(1.5);
        }
        .X.axis.x축 뒤집기 {
            transform: rotateX(180deg);
        }
        .X.axis.y축 뒤집기 {
            transform: rotateY(180deg);
        }
        .X.axis.z축 뒤집기 {
            transform: rotateZ(180deg);
        }
    </style>
</head>
<body>
    <button class="비틀기">비틀기</button>
    <button class="확대">확대</button>
    <button class="X axis x축 뒤집기">X axis x축 뒤집기</button>
    <button class="X axis y축 뒤집기">y axis y축 뒤집기</button>
    <button class="X axis z축 뒤집기">z axis z축 뒤집기</button>
</body>
</html>
