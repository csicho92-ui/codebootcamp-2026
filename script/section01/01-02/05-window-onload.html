<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dom load 실습</title>
    <script>
        window.onload = () => {
            const 내이름 =prompt("이름을 입력해주세요");
            document.getElementById("이름을 입력하는 곳").innerText = 내이름
        }
    </script>
</head>
<body>
    
</body>
    <span id="이름을 입력하는 곳"></span>의 다이어리에 오신것을 환영합니다. 
</html>
