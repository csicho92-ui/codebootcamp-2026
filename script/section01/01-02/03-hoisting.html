<!DOCTYPE html>
<html lang="en">
<head>
   <script>
    // 아래에서 만든 함수를 = 함수호이스팅
        // 함수 호이스팅
        function 내가만든함수() {
            console.log("내가 만든 함수 실행");
        }
 
        // 변수 호이스팅 : 아래에서 만든 변수를 위에서 실행

        console.log(내가만든변수); // undefined, 변수호이스팅 떄문에 선언은 위로 올라가지만, 값은 할당되지 않음

        var 내가만든변수 = "변수의 값";
        
        console.log(내가만든변수); // "변수의 값"

    


    <title>Document</title>
</head>
<body>
    
</body>
</html>
