<!DOCTYPE html>
<html lang="en">
<head>
    <title>키보드 감지 실습</title>
    <style>
        .춘식이 {
            position: absolute;
            top: 300px;
            left: 300px;

            width: 100px;
            height: 100px;
        }
    </style>
    <script>

        let 부스터 = 1.0;
        window.addEventListener("keydown", (event) => {
            const 춘식이 = document.getElementById("춘식이ID");
            const 춘식이스타일 = getComputedStyle(춘식이)
            const 춘식이Y좌표 = Number(춘식이스타일.top.replace("px", ""))
            const 춘식이X좌표 = Number(춘식이스타일.left.replace("px", ""))

            switch(event.key) {
                case "ArrowUp": {
                    // 춘식이를 위로 -20 옮긴다
                    document.getElementById("춘식이ID").style = `top: ${춘식이Y좌표 - 20 / 부스터 }px; left: ${춘식이X좌표}px;`
                    break;
                }
                case "ArrowDown": {
                    // 춘식이를 아래로 +20 옮긴다
                    document.getElementById("춘식이ID").style = `top: ${춘식이Y좌표 + 20 * 부스터}px; left: ${춘식이X좌표}px;`
                    break;
                }
                case "ArrowLeft": {
                    // 춘식이를 왼쪽으로 -20 옮긴다
                    document.getElementById("춘식이ID").style = `top: ${춘식이Y좌표}px; left: ${춘식이X좌표 - 20}px;`
                    break;
                }
                case "ArrowRight": {
                    // 춘식이를 오른쪽으로 +20 옮긴다
                    document.getElementById("춘식이ID").style = `top: ${춘식이Y좌표}px; left: ${춘식이X좌표 + 20}px;`
                    break;
                }
            }

        });

        window.addEventListener("keydown", (event) => {
    console.log("키 눌림:", event.key); // 이게 안 찍히면 포커스 문제
    ...
    console.log("계산된 좌표:", 춘식이Y좌표, 춘식이X좌표);
});
    </script>
</head>
<body>  
    <img src="./00-image.jpg" class="춘식이" id="춘식이ID" />
</body>
</html>
