<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모달 만들어 보기</title>
    <style>
        .모달그룹 {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .모달배경 {
            width: 100vw;
            height: 100vh;
            background-color: lightseagreen;
            opacity: 0.9;
        }
        .모달 {
            position: absolute;
            top: calc(50% - 500px/2);
            left: calc(50% - 400px/2);

            width: 400px;
            height: 500px;
            background-color: skyblue;
        }
        .등록완료모달 {
            position: absolute;
            top: calc(50% - 200px/2);
            left: calc(50% - 300px/2);

            width: 700px;
            height: 160px;
            background-color: orangered;
        }
    </style>
    <script>
        const 모달열기 = (모달종류) => {
            // [수정 3] style 전체를 덮어쓰지 않고 display 속성만 변경
            document.getElementById(모달종류).style.display = "block";
        }

        const 모달닫기 = (모달종류) => {
            // [수정 3] style 전체를 덮어쓰지 않고 display 속성만 변경
            document.getElementById(모달종류).style.display = "none";
        }
    </script>
</head>
<body>
    <!-- [수정 1] 인자에 따옴표 추가 + id 오타 수정(모달그루ID -> 모달그룹ID)
         + 원래 열려야 할 "등록모달그룹ID"가 아니라 "모달그룹ID"(일기 등록 모달)를 열도록 수정 -->
    <button onclick="모달열기('모달그룹ID')">모달열기</button>

    <!-- 일기를 등록하는 모달 -->
    <div id="모달그룹ID" class="모달그룹">
        <!-- [수정 2] 자기 자신(모달그룹ID)을 닫아야 하는데 등록모달그룹ID를 닫도록 잘못 되어있던 부분 수정 -->
        <div id="모달배경ID" class="모달배경" onclick="모달닫기('모달그룹ID')"></div>
        <div class="모달">
            <div>
                제목: <input type="text">
            </div>
            <div>
                내용: <textarea></textarea>
            </div>
            <div>
                <button onclick="모달열기('등록모달그룹ID')">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 등록이 완료될때 뜨는 추가 모달 -->
    <div id="등록모달그룹ID" class="모달그룹">
        <div class="모달배경" onclick="모달닫기('등록모달그룹ID')"></div>
        <div class="등록완료모달">
            <p>등록이 완료되었습니다.</p>
        </div>
    </div>

</body>
</html>
