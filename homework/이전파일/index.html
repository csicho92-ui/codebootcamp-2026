<!DOCTYPE html>
<html lang="ko">
<head>
    <title>SOOIN의 감정일기</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>

</head>
<body>
    <!-- 구조예시
header.header
├─ p (타이틀)
└─ div.toggle-switch (다크모드)

main.main
├─ img.cover-img (커버 이미지)
├─ ul.tab-list (탭 메뉴)
├─ select.filter-select (드롭다운)
├─ input.search-input (검색창)
└─ button.write-btn (일기쓰기 버튼)

footer.footer
└─ p x3 (저작권 정보) -->

        <header class="header"> 
            <!-- css에서 꾸밀때 "어떤요소를 꾸밀지"찾기위해 class에 네이밍을 하는 것 -->
           <p>SOOIN의 다이어리</p>
           <!-- 토글스위치 -->
           <div class="toggle-switch">
            <input type="checkbox" id="switch">
            <label for="switch"><span class="switch-toggle"><i></i></span>다크모드
            </label>
           </div>
        </header>

        <main class="main">
            <!-- src이미지의 주소 / alt 이미지를 설명하는 것  -->
            <img class="cover-img" src="img_sample/img_1.png" alt="img_sample">

            <ul class="tab-list">
                <li>일기보관함</li>
                <li>사진보관함</li>
            </ul>
            <div class="toolbar">
                <div class="filter-group">
                <select class="filter-select">
			        <option disabled="true" selected="true">전체</option>
                        <option>???</option>
			            <option>???</option>
			            <option>???</option>
                </select>
                <input class ="search-input" type="text" placeholder="검색어를 입력해주세요.">
                </div>
                <button class="write-btn">+일기쓰기</button>
            </div>
        </main>  
        <footer class="footer">
          <p>SOOIN 다이어리 </p>
          <p>대표 : 조수인 </p>
          <p>Copyright © 2026.</p>
        </footer>  
</body>
</html>
