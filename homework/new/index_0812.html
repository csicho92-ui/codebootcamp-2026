<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수인이의 감정일기</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
    }

    @font-face {
        font-family: "HS활공명조";
        src: url("HSHwalkongSerif-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
    }

    @font-face {
        font-family: "Cloudsofa";
        src: url("Cloudsofa_namgim-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
    }

    html {
        font-size: 16px;
    }

    body {
        margin: 0;
        padding: 0;
        font-size: 16px;
        font-family: "HS활공명조", "Apple SD Gothic Neo", serif;
        line-height: 1.6;
    }

    button,
    input,
    select,
    textarea {
        font-family: inherit;
    }

    .darkmode-make {
        color: white;
        background-color: black;
    }

    .darkmode-make .header {
        background-color: #222222;
    }

    .darkmode-make .search-input {
        background-color: #222222;
        color: #eee;
    }

    .darkmode-make .filter-select {
        background-color: #222222;
        color: #eee;
    }

    .darkmode-make .filter-list {
        background-color: #222222;
        border-color: #555555;
    }

    .darkmode-make .filter-list label:hover,
    .darkmode-make .filter-list input:checked + label {
        background-color: #444444;
    }

    .darkmode-make .write {
        background-color: #f8f6f6;
        color: #111111;
    }

    .darkmode-make .footer {
        background-color: #111111;
    }

    .darkmode-make .modal {
        background-color: #111111;
    }

    .darkmode-make .complete-modal {
        background-color: #111111;
    }

    .darkmode-make .complete-modal button {
        background-color: #f8f6f6;
        color: #111111;
    }

    .darkmode-make .tab.active {
        color: #eee;
        border-bottom: #666464 solid 3px;
    }

    .darkmode-make .tab {
        color: #666464;
    }

    .darkmode-make .pagination button {
        background-color: #222222;
        border-color: #555555;
        color: #eeeeee;
    }

    .header {
        max-width: 1168px;
        margin: 0 auto;
        padding: 20px;
        height: 78px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.75);
        font-size: 24px;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
    }

    .cover {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 20px;
    }

    .로고 {
        font-family: "Cloudsofa";
        letter-spacing: 0.04em;
        cursor: pointer;
    }

    .toggle-switch {
        appearance: none;
        width: 40px;
        height: 24px;
        background-color: lightgray;
        border-radius: 20px;
        padding: 2px;
        font-size: 14px;
        cursor: pointer;
    }

    .다크모드 {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 14px;
    }

    .toggle-switch::after {
        display: block;
        content: "";
        width: 20px;
        height: 20px;
        background-color: aliceblue;
        border-radius: 50%;
        transition: transform 0.3s ease;
    }

    .toggle-switch:checked {
        background-color: rgb(135, 222, 154)
    }

    .toggle-switch:checked::after {
        transform: translateX(calc(100% - 2px - 2px));
    }

    .tab-list {
        font-size: 1.5rem;
        list-style: none;
        display: flex;
        justify-content: flex-start;
        gap: 24px;
        padding: 20px;
    }

    .tab-list div {
        cursor: pointer;
        font-weight: bold;
        font-size: 18px;
    }

    .tab {
        color: #afafaf
    }

    .tab.active {
        color: #2c2b2b;
        border-bottom: #2c2b2b solid 3px;
    }

    .toolbar {
        height: 60px;
        padding: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .filter-group {
        height: 70px;
        display: flex;
        gap: 12px;
        align-items: center;
        position: relative;
    }

    .filter-box {
        width: 95px;
        position: relative;
    }

    #비율드롭다운 {
        --선택한필터: "1:1";
    }

    .filter-select {
        --선택한필터: "전체";
        appearance: none;
        background-image: url(/homework/new/Vector\ \(1\).png);
        background-repeat: no-repeat;
        background-position: right 14px center;
        background-color: white;
        height: 43px;
        width: 95px;
        margin: 0;
        padding: 0 14px;
        border-radius: 8px;
        border: 2px solid #dddddd;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
    }

    .filter-select:hover {
        border-color: palevioletred;
    }

    .filter-select::after {
        content: var(--선택한필터);
        display: block;
        line-height: 39px;
    }

    .filter-select:checked + .filter-list {
        display: block;
    }

    .filter-list {
        width: 130px;
        margin: 0;
        padding: 6px;
        border: 2px solid #dddddd;
        border-radius: 10px;
        background-color: white;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        list-style: none;
        position: absolute;
        left: 0;
        z-index: 5;
        display: none;
        top: 51px;
    }

    .filter-list input {
        display: none;
    }

    .filter-list label {
        padding: 10px;
        border-radius: 7px;
        display: block;
        cursor: pointer;
        font-size: 15px;
    }

    .filter-list label:hover,
    .filter-list input:checked + label {
        background-color: #f1f1f1;
    }

    .search-input {
        height: 43px;
        width: 320px;
        border-radius: 8px;
        padding: 0 14px;
        background-color: white;
        border: 2px solid #dddddd;
        font-size: 15px;
    }

    .write {
        height: 43px;
        width: 150px;
        font-weight: bold;
        padding: 0 10px;
        border-radius: 8px;
        background-color: rgb(15, 87, 7);
        color: white;
        border: none;
        font-size: 18px;
        cursor: pointer;
    }

    .write:hover {
        transform: scale(1.03);
    }

    .main {
        max-width: 1168px;
        margin: 0 auto;
        width: 100%;
    }

    .diary-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin: 40px 0 20px;
    }

    .pagination button {
        min-width: 34px;
        height: 34px;
        padding: 0 8px;
        border: 1px solid #dddddd;
        border-radius: 8px;
        background-color: white;
        color: #666666;
        font-size: 14px;
        cursor: pointer;
    }

    .pagination button:hover:not(:disabled) {
        border-color: rgb(15, 87, 7);
    }

    .pagination button.active {
        background-color: rgb(15, 87, 7);
        border-color: rgb(15, 87, 7);
        color: white;
        font-weight: bold;
    }

    .pagination button:disabled {
        color: #cccccc;
        cursor: default;
    }

    .card {
        height: 350px;
        width: 285px;
        padding: 10px;
        border-radius: 24px;
        position: relative;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .행복배경 {
        background: linear-gradient(45deg, rgb(250, 250, 204), transparent),
                    linear-gradient(135deg, red, transparent),
                    linear-gradient(225deg, rgb(245, 168, 158), transparent),
                    linear-gradient(315deg, rgb(151, 240, 151), transparent);
    }

    .슬픔배경 {
        background: linear-gradient(45deg, rgb(105, 243, 174), transparent),
                    linear-gradient(135deg, rgb(77, 42, 230), transparent),
                    linear-gradient(225deg, rgb(198, 236, 248), transparent),
                    linear-gradient(315deg, rgb(81, 13, 207), transparent);
    }

    .놀람배경 {
        background: linear-gradient(45deg, rgb(252, 211, 101), transparent),
                    linear-gradient(135deg, rgb(52, 241, 241), transparent),
                    linear-gradient(225deg, rgb(250, 89, 223), transparent),
                    linear-gradient(315deg, rgb(252, 66, 81), transparent);
    }

    .화남배경 {
        background: linear-gradient(45deg, rgb(238, 95, 85), transparent),
                    linear-gradient(135deg, rgb(235, 206, 164), transparent),
                    linear-gradient(225deg, rgb(248, 129, 198), transparent),
                    linear-gradient(315deg, rgb(152, 145, 218), transparent);
    }

    .기타배경 {
        background: linear-gradient(45deg, rgba(219, 156, 200, 0.76), transparent),
                    linear-gradient(135deg, rgb(112, 86, 111), transparent),
                    linear-gradient(225deg, rgb(209, 151, 236), transparent),
                    linear-gradient(315deg, rgb(78, 62, 223), transparent);
    }

    .행복글씨 { color: #FF82A9; }
    .슬픔글씨 { color: #7F95D1; }
    .놀람글씨 { color: #FFC0BE; }
    .화남글씨 { color: #5f5c5c; }
    .기타글씨 { color: #899D78; }

    .card-emogi-back {
        width: 180px;
        height: 180px;
        padding: 45px;
        border-radius: 50%;
        background-color: #fcfcfc;
    }

    .card-emogi {
        margin-bottom: 14px;
        text-align: center;
        font-size: 4rem;
        border-radius: 20px;
        height: 208px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .delete-card {
        width: 30px;
        height: 30px;
        padding: 0;
        background-color: #fcfcfc;
        border: 1px solid #dddddd;
        border-radius: 50%;
        position: absolute;
        top: 30px;
        right: 30px;
        line-height: 20px;
        cursor: pointer;
    }

    .card-info {
        display: flex;
        border-radius: 24px;
        justify-content: space-between;
    }

    .card-text {
        display: flex;
        font-size: 1.5rem;
    }

    .card-content {
        margin-top: 8px;
        font-size: 1rem;
        color: #888888;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .footer {
        height: 60px;
        max-width: 1168px;
        margin: 0 auto;
        background-color: rgb(207, 231, 203);
        padding: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .floating_button {
        width: 30pt;
        height: 30pt;
        background-color: rgb(255, 255, 255);
        border-radius: 50%;
        cursor: pointer;
        position: fixed;
        right: 20px;
        bottom: 20px;
        border: none;
        outline: none;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.15);
    }

    .floating_button:hover {
        transform: scale(1.03);
    }

    .floating_button img {
        width: 16px;
    }

    .modal-background {
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.48);
        position: fixed;
        top: 0;
        left: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
    }

    .modal {
        width: 640px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 30px;
        border-radius: 8px;
        background-color: #fcfcfc;
        font-size: 24px;
    }

    .기분선택 {
        display: flex;
        gap: 5px;
        flex-direction: column;
        font-size: 16px;
        margin-top: 15px
    }

    .기분목록 {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
    }

    .기분목록 label {
        font-size: 14px;
    }

    .complete-modal-background {
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.48);
        position: fixed;
        top: 0;
        left: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
    }

    .complete-modal {
        width: 300px;
        padding: 30px;
        border-radius: 12px;
        background-color: white;
        text-align: center;
        font-size: 16px;
    }

    .complete-modal p {
        margin-bottom: 20px;
    }

    .complete-modal button {
        width: 100%;
        height: 43px;
        background-color: black;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    .일기내용 {
        margin-top: 16px;
    }

    .입력라벨 {
        font-size: 14px;
        margin-bottom: 8px;
    }

    .제목 {
        width: 100%;
        height: 30px;
        font-size: 12px;
        color: rgb(80, 80, 80);
        background-color: #f8f2f2;
        border: none;
        border-radius: 8px;
        padding: 12px;
        resize: none;
    }

    .내용 {
        width: 100%;
        height: 128px;
        font-size: 14px;
        background-color: #f8f2f2;
        color: rgb(80, 80, 80);
        border: none;
        border-radius: 8px;
        padding: 12px;
        resize: none;
    }

    .modal-button {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin-top: 24px;
    }

    .modal-button button {
        width: 104px;
        height: 48px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .modalclose {
        border: 1px solid #222222;
        background-color: white;
    }

    .등록하기 {
        border: 0;
        background-color: #111111;
        color: white;
    }

    .등록하기:disabled {
        background-color: #cccccc;
        cursor: default;
    }

    .dog-img {
        width: 50%;
        object-fit: cover;
        border-radius: 8px;
        margin: 0 auto;
    }

    .ratio-1-1 { aspect-ratio: 1 / 1; }
    .ratio-4-3 { aspect-ratio: 4 / 3; }
    .ratio-3-4 { aspect-ratio: 3 / 4; }

    .사진리스트 {
        width: 100%;
        display: grid;
        justify-items: center;
        gap: 20px;
        border-radius: 15px;
        grid-template-columns: 1fr;
    }

    .skeleton {
        background: linear-gradient(90deg, #eee 25%, #ddd 50%, #eee 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.2s infinite;
    }

    .하단바깥 {
        margin-top: 80px;
    }

    .하단 {
        width: 100%;
        max-width: 1208px;
        height: 150px;
        margin: 0 auto;
        padding: 28px 20px 0 20px;
    }

    .하단제목 {
        margin-bottom: 25px;
        font-size: 16px;
        font-weight: bold;
    }

    .하단글씨 {
        margin-top: 12px;
        color: #aaaaaa;
        font-size: 13px;
    }

    @keyframes skeleton-loading {
        from { background-position: 200% 0; }
        to { background-position: -200% 0; }
    }

    @media (max-width: 500px) {
        .card-emogi { height: 120px; }

        .card-emogi-back {
            width: 120px;
            height: 120px;
        }

        .card {
            height: 120px;
            width: 100%;
        }

        .diary-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            order: 1;
        }

        .footer { order: 1; }
        .modal { width: 90%; }
        .사진리스트 { grid-template-columns: 1fr 1fr; }
    }
</style>
<script>

    const darkmord = () => {
        document.body.classList.toggle("darkmode-make")
    }

    function scrolltotop() {
        window.scrollTo({ top: 0, behavior: "smooth" })
    }

    function modalopen() {
        document.getElementById("modal-background").style.display = "flex"
        window.scrollTo({ top: 0, behavior: "smooth" })
        document.body.style.overflow = "hidden"
    }

    function modalclose() {
        document.getElementById("modal-background").style.display = "none"
        document.body.style.overflow = "auto"
    }

    // 중첩 모달(등록 완료) 열기/닫기
    function 완료모달열기() {
        document.getElementById("complete-modal-background").style.display = "flex"
    }

    function 완료모달닫기() {
        document.getElementById("complete-modal-background").style.display = "none"
        document.getElementById("modal-background").style.display = "none"
        document.body.style.overflow = "auto"
    }

    function 날짜바꾸기(날짜값) {
        const [년, 월, 일] = 날짜값.split("-")
        return `${년}년${월}월${일}일`
    }

    function 오늘날짜가져오기() {
        const 오늘 = new Date()
        const 년 = 오늘.getFullYear()
        const 월 = String(오늘.getMonth() + 1).padStart(2, "0")
        const 일 = String(오늘.getDate()).padStart(2, "0")
        return `${년}년${월}월${일}일`
    }

    function 일기등록하기() {
        const 감정 = 선택한감정가져오기()
        const 날짜값 = document.getElementById("날짜").value

        const 새일기 = {
            번호: Date.now(),
            감정: 감정,
            이모지: 감정이모지가져오기(감정),
            날짜: 날짜값 === "" ? 오늘날짜가져오기() : 날짜바꾸기(날짜값),
            제목: document.getElementById("제목").value,
            내용: document.getElementById("내용").value
        }

        일기목록.push(새일기)

        document.getElementById("제목").value = ""
        document.getElementById("내용").value = ""
        document.getElementById("날짜").value = ""
        document.getElementById("행복").checked = true
        document.getElementById("등록하기버튼").disabled = true

        필터적용하기()

        document.getElementById("modal-background").style.display = "none"
        완료모달열기()
    }

    // 제목/내용 입력 여부에 따라 등록 버튼 활성화
    function 등록버튼확인하기() {
        const 제목 = document.getElementById("제목").value
        const 내용 = document.getElementById("내용").value
        document.getElementById("등록하기버튼").disabled = (제목 === "" || 내용 === "")
    }

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            const 완료모달 = document.getElementById("complete-modal-background")
            if (완료모달.style.display === "flex") {
                완료모달닫기()
            } else {
                modalclose()
            }
        }
    })

    // 탭 이동
    function 탭이동(탭) {
        const 다이어리인지 = (탭 === '다이어리')

        document.getElementById("다이어리영역").style.display = 다이어리인지 ? "block" : "none"
        document.getElementById("사진영역").style.display = 다이어리인지 ? "none" : "block"

        document.getElementById("감정필터박스").style.display = 다이어리인지 ? "block" : "none"
        document.getElementById("비율필터박스").style.display = 다이어리인지 ? "none" : "block"
        document.getElementById("검색창").style.display = 다이어리인지 ? "block" : "none"

        if (!다이어리인지) { 강아지사진불러오기() }
        탭선택(탭)
    }

    let 선택한비율 = "ratio-1-1"

    function 비율바꾸기(event) {
        const 비율 = event.target.value
        const 비율클래스 = { "1:1": "ratio-1-1", "4:3": "ratio-4-3", "3:4": "ratio-3-4" }[비율]

        선택한비율 = 비율클래스
        document.getElementById("비율드롭다운").style = `--선택한필터: "${비율}"`
        document.getElementById("비율드롭다운").click()
        비율변경(비율클래스)
    }

    function 비율변경(비율필터) {
        const 이미지들 = document.querySelectorAll('.dog-img')
        이미지들.forEach(img => {
            img.classList.remove('ratio-1-1', 'ratio-4-3', 'ratio-3-4')
            img.classList.add(비율필터)
        })
    }

    function 탭선택(탭) {
        if (탭 === '다이어리') {
            document.getElementById("다이어리탭").classList.add("active")
            document.getElementById("사진탭").classList.remove("active")
        } else {
            document.getElementById("사진탭").classList.add("active")
            document.getElementById("다이어리탭").classList.remove("active")
        }
    }

    let 일기목록 = [
        { 번호:1, 감정:"행복", 이모지: "😊", 날짜: "2026년08월06일", 제목: "오늘은 열공중!", 내용: "CSS 드롭다운 만들다가 하루 다 갔다"},

    ]

    function 카드한개만들기(일기) {
        return `
            <div class="card" data-감정="${일기.감정}">
                <div class="card-emogi ${감정배경가져오기(일기.감정)}">
                    <div class="card-emogi-back">${일기.이모지}
                        <button class="delete-card" onclick="일기삭제하기(${일기.번호})">❌</button>
                    </div>
                </div>

                <div class="card-info">
                    <span class="${감정글씨가져오기(일기.감정)}">${일기.감정}</span>
                    <span>${일기.날짜}</span>
                </div>
                <div class="card-text">
                    <span>${일기.제목}</span>
                </div>
                <div class="card-content">
                    <span>${일기.내용}</span>
                </div>
            </div>
        `
    }

    function 선택한감정가져오기() {
        if (document.getElementById("행복").checked) return "행복"
        if (document.getElementById("슬픔").checked) return "슬픔"
        if (document.getElementById("놀람").checked) return "놀람"
        if (document.getElementById("화남").checked) return "화남"
        return "기타"
    }

    function 감정이모지가져오기(감정) {
        if (감정 === "행복") return "😊"
        if (감정 === "슬픔") return "😢"
        if (감정 === "놀람") return "😲"
        if (감정 === "화남") return "😠"
        return "🤔"
    }

    function 감정글씨가져오기(감정) {
        if (감정 === "행복") return "행복글씨"
        if (감정 === "슬픔") return "슬픔글씨"
        if (감정 === "놀람") return "놀람글씨"
        if (감정 === "화남") return "화남글씨"
        return "기타글씨"
    }

    function 감정배경가져오기(감정) {
        if (감정 === "행복") return "행복배경"
        if (감정 === "슬픔") return "슬픔배경"
        if (감정 === "놀람") return "놀람배경"
        if (감정 === "화남") return "화남배경"
        return "기타배경"
    }

    function 일기삭제하기(번호) {
        일기목록 = 일기목록.filter(일기 => 일기.번호 !== 번호)
        검색결과목록 = 검색결과목록.filter(일기 => 일기.번호 !== 번호)

        // 마지막 페이지의 카드를 다 지웠으면 한 페이지 앞으로
        const 마지막페이지 = Math.max(1, Math.ceil(검색결과목록.length / 페이지당개수))
        if (현재페이지 > 마지막페이지) 현재페이지 = 마지막페이지

        페이지그리기()
    }

    window.onload = function () {
        필터적용하기()
    }

    function 일기목록그리기(보여줄목록) {
        document.getElementById("일기목록").innerHTML =
            보여줄목록.map(일기 => 카드한개만들기(일기)).join("")
    }


    /*  필터 · 검색 · 페이지네이션  */

    let 타이머 = null
    let 선택한감정 = "전체"
    let 입력한검색어 = ""

    const 페이지당개수 = 6      // 한 페이지에 보여줄 카드 수
    let 현재페이지 = 1
    let 검색결과목록 = []       // 필터·검색을 통과한 전체 목록

    // 1. 감정 필터 + 검색어로 걸러내기
    function 필터적용하기() {
        검색결과목록 = 일기목록.filter(일기 => {
            const 감정이맞는지 = 선택한감정 === "전체" || 일기.감정 === 선택한감정
            const 제목이맞는지 = 일기.제목.includes(입력한검색어)
            return 감정이맞는지 && 제목이맞는지
        })

        현재페이지 = 1          // 필터가 바뀌면 항상 1페이지부터
        페이지그리기()
    }

    // 2. 현재 페이지에 해당하는 6개만 잘라서 그리기
    function 페이지그리기() {
        const 시작 = (현재페이지 - 1) * 페이지당개수
        일기목록그리기(검색결과목록.slice(시작, 시작 + 페이지당개수))
        페이지버튼그리기()
    }

    // 3. 페이지 버튼을 눌렀을 때
    function 페이지이동(페이지) {
        현재페이지 = 페이지
        페이지그리기()
    }

    // 4. 하단 페이지 버튼 만들기
    function 페이지버튼그리기() {
        const 마지막페이지 = Math.ceil(검색결과목록.length / 페이지당개수)
        const 영역 = document.getElementById("페이지네이션")

        if (마지막페이지 <= 1) {
            영역.innerHTML = ""
            return
        }

        let html = `<button onclick="페이지이동(${현재페이지 - 1})" ${현재페이지 === 1 ? "disabled" : ""}>‹</button>`

        for (let i = 1; i <= 마지막페이지; i++) {
            html += `<button class="${i === 현재페이지 ? "active" : ""}" onclick="페이지이동(${i})">${i}</button>`
        }

        html += `<button onclick="페이지이동(${현재페이지 + 1})" ${현재페이지 === 마지막페이지 ? "disabled" : ""}>›</button>`

        영역.innerHTML = html
    }

    function 감정바꾸기(event) {
        선택한감정 = event.target.value
        document.getElementById("필터드롭다운").style = `--선택한필터: "${선택한감정}"`
        document.getElementById("필터드롭다운").click()
        필터적용하기()
    }

    // 검색기능에 타이머 넣기
    function 검색기능(event) {
        const 검색어 = event.target.value
        clearTimeout(타이머)

        타이머 = setTimeout(() => {
            입력한검색어 = 검색어
            필터적용하기()
        }, 700)
    }


    function 강아지사진불러오기() {
        fetch('https://dog.ceo/api/breeds/image/random/10')
            .then(응답 => {
                if (!응답.ok) throw new Error('불러오기 실패')
                return 응답.json()
            })
            .then(결과 => {
                const 이미지주소들 = 결과.message
                document.getElementById('사진목록').innerHTML += 이미지주소들.map(주소 => `
                <img class="dog-img ${선택한비율} skeleton" src="${주소}" onload="this.classList.remove('skeleton')">
                `).join('')
            })
            .catch(에러 => console.error(에러))
    }

    let 스크롤타이머 = null
    window.addEventListener('scroll', () => {
        if (스크롤타이머 !== null) return

        스크롤타이머 = setTimeout(() => {
            스크롤타이머 = null
        }, 700)

        if (document.getElementById('사진영역').style.display === 'none') return

        const 스크롤퍼센트 = window.scrollY / (document.body.scrollHeight - window.innerHeight)

        if (스크롤퍼센트 >= 0.7) {
            강아지사진불러오기()
        }
    })
</script>

                </ul>
            </div>

            <input class="search-input" id="검색창" type="text" placeholder="🔎 검색어를 입력해주세요." oninput="검색기능(event)">
        </div>

        <button class="write" onclick="modalopen()">+일기쓰기</button>

    <div class="콘텐츠영역" id="다이어리영역">
