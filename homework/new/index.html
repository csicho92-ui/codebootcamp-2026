<!DOCTYPE html>
<html lang="ko">
<head>
    <title>수인이의 감정일기</title>
    <style>

/* 부모 상자 ┌──────────────────────┐

flex-start     [A][B][C]···········   ← 왼쪽에 몰기
flex-end       ···········[A][B][C]   ← 오른쪽에 몰기
center         ·····[A][B][C]·····   ← 가운데
space-between  [A]·····[B]·····[C]   ← 양 끝에 붙이고 사이 벌리기 */


        * {
            box-sizing:border-box;
            margin: 0;

        }
        body {
            margin: 0;
            padding: 0 px;        
        }

        .header {
            max-width: 1168px;
            margin: 0 auto;
            padding: 5px;

            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tab-list {
            border-bottom: 2px solid black;
            font-size: 1.5rem;
            list-style: none;
            display: flex;
            justify-content: flex-start;
            padding: 0;
            gap: 24px;
            padding: 5px;

        }
        .toolbar {
            height: 60px;
            padding: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            
        }
        .filter-group {
            height: 60px;
            display: flex;
            gap: 12px;
            align-items: center;
            
        }
        .main {
            max-width: 1168px;
            margin: 0 auto;
            width: 100%;
        }
        .diary-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

        }

        .card {
            height: 480px;
            width: 360px;
            padding: 20px;
            border-radius: 24px;
        }
        .card-emogi-back {
            width: 180px;
            height: 180px;
            padding: 45px;
            border-radius: 50%;
            background-color: #fcfcfc;
            
        }
        .card-emogi {  
            margin-bottom: 14px;
            text-align: center;
            font-size: 4rem;
            background-color: rgb(231, 231, 194);
            border-radius:  20px;
            height: 208px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-info {
            display: flex;
            border-radius: 24px;
            justify-content: space-between;
        }

        .card-text {
            display: flex;
            font-size: 1.5rem;
        }
        .footer {
            height: 60px;
            max-width: 1168px;
            margin: 0 auto;
            background-color: rgb(233, 213, 171);
            padding: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        .floating_button {
            width: 50pt;
            height: 50pt;
            background-color: rgb(224, 110, 95);
            border-radius: 100%;
            cursor: pointer;

            position: fixed;
            right: 20px;
            bottom: 20px;
        }
        @media (max-width: 500px) {
            
            
            .card-emogi {
            height: 120px; }

            .card-emogi-back {
            width: 120px;
            height: 120px; }

            .card {
            height: 120px;
            width: 100%;            
            }

            .diary-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            order: 1; }

            .footer {
                order: 1;
            }
        }

    </style>
</head>
